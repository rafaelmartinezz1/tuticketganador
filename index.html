<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tu Ticket Ganador</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .desktop-svg {
      display: block;
    }
    .mobile-svg {
      display: none;
    }

    @media (max-width: 768px) {
      .desktop-svg {
        display: none;
      }
      .mobile-svg {
        display: block;
      }
    }
  </style>
</head>
<body>
  <img src="desktop.svg" alt="Desktop SVG" class="desktop-svg">
  <img src="mobile.svg" alt="Mobile SVG" class="mobile-svg">
</body>
</html>
